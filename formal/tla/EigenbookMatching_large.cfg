\* Large model (Phase B2.1): 3 prices, 3 ids, quantity <= 2, at most 5 rests or re-entries.
\* Long-running; the default model is EigenbookMatching.cfg. Recorded runs: formal/README.md.

SPECIFICATION Spec

\* Ids are not reused, so once all are used and the book is empty nothing is enabled: that end
\* state is expected, not a deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
    Prices = {1, 2, 3}
    Ids = {1, 2, 3}
    MaxQty = 2
    MaxSeq = 5
    Tifs = {"GTC", "IOC", "FOK"}

INVARIANTS
    TypeOK
    QueueConsistent
    NoEmptyLevel
    NoCross
    QuantityConservation
    PriorityStampsIncrease
    PriceTimePriority
    MakerPrice
    NoTradeThroughLimit
    MarketNeverRests
    ModifyPriorityRule
    FokAllOrNothing
    PostOnlyNeverTakes
    FilledMatchesTrades
